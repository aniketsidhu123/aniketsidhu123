  .blue { fill: #8ed8ff; } .violet { fill: #c4abff; } .green { fill: #8ce5c8; }
  .bar { transform-box: fill-box; transform-origin: left; animation: rise .85s cubic-bezier(.22,.61,.36,1) both; }
